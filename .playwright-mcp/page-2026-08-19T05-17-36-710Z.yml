              - listitem [ref=f2e483]: 6개 품목의 영업이익을 단순 합산하면 51,162,610,000원입니다. 다만 전체 영업이익률은 품목별 매출액 합계가 결과에 별도 표시되지 않아 산출하지 않았습니다.
            - paragraph [ref=f2e484]: 💡 손익 요인 분석
            - list [ref=f2e485]:
              - listitem [ref=f2e486]: 제공된 결과에는 평균 판가와 평균 스프레드가 포함되어 있으나, 전월 또는 목표 대비 변동값은 없습니다. 따라서 판가 상승·하락과 원재료비 상승·하락 중 어느 요인이 스프레드 변화를 주도했는지는 이번 조회만으로 판단할 수 없습니다.
              - listitem [ref=f2e487]: 3월 단일 시점의 수준을 보면 특수강은 평균 판가 1,168,000원/단위, 평균 스프레드 466,000원/단위로 가장 높습니다. 반면 후판은 평균 판가 957,497원/단위, 평균 스프레드 259,263원/단위로 6개 품목 중 스프레드가 가장 낮습니다.
              - listitem [ref=f2e488]: 특수강은 스프레드가 가장 높음에도 영업이익률이 0.17%에 불과하고, 열연은 특수강보다 평균 스프레드가 196,848원/단위 낮은 269,152원/단위임에도 영업이익률은 5.81%입니다. 이는 현재 결과상 스프레드 수준만으로 영업이익률을 설명하기 어렵다는 점을 보여줍니다.
              - listitem [ref=f2e489]:
                - text: 원재료비는
                - code [ref=f2e490]: raw_material*sales_vol
                - text: 형태로 스프레드 계산에 반영됐지만, 품목별 평균 원재료비와 전월 대비 변동액은 결과에 별도 제시되지 않았습니다. 따라서 품목별 손익 차이를 판가 요인과 원가 요인으로 정량 분해하려면 해당 항목의 추가 조회가 필요합니다.
            - paragraph [ref=f2e491]: ⚠️ 주의 필요 세그먼트
            - list [ref=f2e492]:
              - listitem [ref=f2e493]: 후판은 영업이익 -3,965,650,000원, 영업이익률 -2.25%로 6개 품목 중 적자 규모와 적자율이 가장 큽니다. 평균 스프레드도 259,263원/단위로 가장 낮습니다.
              - listitem [ref=f2e494]: 철근은 영업이익 -1,219,420,000원, 영업이익률 -0.56%로 적자를 기록했습니다. 평균 스프레드는 265,641원/단위로 후판보다 6,378원/단위 높지만 영업이익은 적자입니다.
              - listitem [ref=f2e495]: 특수강은 적자는 아니지만 평균 스프레드 466,000원/단위 대비 영업이익률이 0.17%로 낮아, 스프레드가 실제 영업이익으로 전환되는 수준에 대한 점검이 필요합니다.
              - listitem [ref=f2e496]: 적자 품목인 철근과 후판의 영업손실 합계는 -5,185,070,000원입니다. 이번 조회는 3월 단일 월 기준이므로 전월 대비 적자 확대·축소 여부는 포함하지 않았습니다.
